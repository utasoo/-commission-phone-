function openStory(i){storyIndex=i;$('title').textContent='스토리';renderStory()}
function renderStory(){let p=storyItems[storyIndex];if(!p)return gallery();show('<div class="story"><div class="storyProgress" id="storyProgress"></div><div class="storyTop"><button id="storyClose">×</button><span id="storyName"></span><span id="storyCounter"></span></div><div class="storyPicture" id="storyPicture"></div><div class="storyNav"><button id="storyPrev"></button><button id="storyNext"></button></div><button class="storyComment" id="storyComment">댓글 보기</button></div><div id="storySheet" class="storySheet" hidden></div>');$('storyName').textContent=p.nickname;$('storyCounter').textContent=(storyIndex+1)+' / '+storyItems.length;storyItems.forEach((_,i)=>{let bar=document.createElement('span');bar.style.opacity=i<=storyIndex?1:.35;$('storyProgress').append(bar)});let img=document.createElement('img');img.src=photoUrl(p.image_path);img.alt=p.caption||'커미션';$('storyPicture').append(img);$('storyClose').onclick=gallery;$('storyPrev').onclick=()=>{storyIndex=(storyIndex-1+storyItems.length)%storyItems.length;renderStory()};$('storyNext').onclick=()=>{storyIndex=(storyIndex+1)%storyItems.length;renderStory()};$('storyComment').onclick=()=>openComments(p.id)}
async function openComments(postId){let sh=$('storySheet');sh.hidden=false;sh.innerHTML='<div class="sheetHandle"></div><div class="sheetHeader"><strong>댓글 ♡</strong><button id="closeComments">×</button></div><div id="storyComments">불러오는 중...</div><form id="storyForm"><input id="storyNick" maxlength="20" required placeholder="닉네임"><textarea id="storyText" maxlength="500" required placeholder="댓글 입력..."></textarea><button class="btn" id="submitStory">게시</button><button type="button" id="cancelReply" hidden>답글 취소</button></form><p id="commentStatus" class="storyNotice"></p>';$('closeComments').onclick=()=>sh.hidden=true;let parent=null;async function refresh(){let rows=await api('commission_comments?select=id,parent_id,nickname,content,created_at&post_id=eq.'+postId+'&order=created_at.asc&limit=300')||[];let list=$('storyComments');list.replaceChildren();if(!rows.length)list.textContent='댓글이 없습니다.';let ordered=[];function walk(pid,depth){rows.filter(x=>x.parent_id===pid).forEach(x=>{ordered.push([x,depth]);if(depth<10)walk(x.id,depth+1)})}walk(null,0);rows.forEach(x=>{if(!ordered.some(y=>y[0].id===x.id))ordered.push([x,0])});ordered.forEach(([x,depth])=>{let d=document.createElement('div');d.className='storyCommentCard'+(depth?' isReply':'');d.style.marginLeft=Math.min(depth,3)*12+'px';let name=document.createElement('strong');name.textContent=x.nickname;let txt=document.createElement('p');txt.textContent=x.content;let btn=document.createElement('button');btn.textContent='↳ 답글 달기';btn.onclick=()=>{parent=x.id;$('storyText').placeholder=x.nickname+'님에게 답글';$('cancelReply').hidden=false};d.append(name,txt,btn);list.append(d)})}try{await refresh()}catch(e){$('storyComments').textContent='댓글 불러오기 실패';console.error(e)}$('cancelReply').onclick=()=>{parent=null;$('cancelReply').hidden=true;$('storyText').placeholder='댓글을 남겨줘 ♡'};$('storyForm').onsubmit=async e=>{e.preventDefault();if(sending)return;let nickname=$('storyNick').value.trim(),content=$('storyText').value.trim();if(!nickname||!content)return;sending=true;$('submitStory').disabled=true;try{await api('commission_comments',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({post_id:postId,parent_id:parent,nickname,content})});$('storyText').value='';parent=null;$('cancelReply').hidden=true;await refresh();$('commentStatus').textContent='댓글이 저장됐어 ♡'}catch(err){$('commentStatus').textContent='저장 실패! 정책을 확인해줘.';console.error(err)}finally{sending=false;$('submitStory').disabled=false}}}
function messages(){chat='';$('title').textContent='메시지';show('<p style="font-size:12px">Messages ♡</p><div id="people"></div>');people.forEach(p=>{let b=document.createElement('button');b.className='person';b.innerHTML='<span class="avatar">'+p[0]+'</span><span><strong>'+p[1]+'</strong><small>'+p[2]+'</small></span>';b.onclick=()=>conversation(p);$('people').append(b)})}function conversation(p){chat=p[1];$('title').textContent=chat;let list=chats[chat]||[{mine:false,text:p[2]}];show('<div class="conversation" id="conv"></div><div class="compose"><input id="msg" placeholder="메시지 입력..."><button class="btn" id="send">전송</button></div>');function draw(){let c=$('conv');c.replaceChildren();list.forEach(m=>{let d=document.createElement('div');d.className='bubble'+(m.mine?' mine':'');d.textContent=m.text;c.append(d)})}draw();function send(){let v=$('msg').value.trim();if(!v)return;list.push({mine:true,text:v});chats[chat]=list;$('msg').value='';draw()}$('send').onclick=send;$('msg').onkeydown=e=>{if(e.key==='Enter')send()}}function music(){show('<div class="player"><div class="album">♫</div><strong id="song"></strong><small>demo playlist ♡</small><div class="controls"><button id="prev">⏮</button><button id="play" class="play">▶</button><button id="next">⏭</button></div><small>음원 파일 연결 전의 테스트 플레이어야</small></div>');function refresh(){$('song').textContent=songs[track];$('play').textContent=playing?'Ⅱ':'▶';document.querySelector('.album')?.classList.toggle('is-playing',playing)}$('prev').onclick=()=>{track=(track+2)%3;playing=false;refresh()};$('next').onclick=()=>{track=(track+1)%3;playing=false;refresh()};$('play').onclick=()=>{playing=!playing;refresh()};refresh()}function calendar(){let first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();show('<div class="month"><button id="prevM">‹</button><strong>'+year+'년 '+(month+1)+'월</strong><button id="nextM">›</button></div><div class="cal" id="cal"></div><div class="event" id="event"></div>');['일','월','화','수','목','금','토'].forEach(w=>{let d=document.createElement('div');d.textContent=w;$('cal').append(d)});for(let i=0;i<first;i++)$('cal').append(document.createElement('div'));for(let d=1;d<=days;d++){let b=document.createElement('button');b.textContent=d;b.className=d===selected?'sel':'';b.onclick=()=>{selected=d;calendar()};$('cal').append(b)}$('event').textContent=(month+1)+'월 '+selected+'일 · 등록된 일정이 없어요 ♡';$('prevM').onclick=()=>{month--;if(month<0){month=11;year--}selected=1;calendar()};$('nextM').onclick=()=>{month++;if(month>11){month=0;year++}selected=1;calendar()}}$('back').onclick=()=>{if(app==='메시지'&&chat)messages();else $('panel').style.display='none'};$('goHome').onclick=()=>{$('panel').style.display='none'};$('bar').onclick=()=>{if($('lock').style.display==='none')$('panel').style.display='none'};
</script><script src="enhancements.js"></script><script src="profile-data.js"></script><script src="profile-ui.js"></script><script src="theme.js"></script><script src="theme-settings.js"></script><script src="startup.js"></script><script src="startup-v2.js"></script><script src="startup-v3.js"></script><script src="minimal-profile.js"></script><script src="minimal-gallery.js"></script><script src="gallery-v5.js?v=7"></script></html>
