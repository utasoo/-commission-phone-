<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lavender Phone</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f8f5fc;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,sans-serif;color:#987db8}button,input,textarea{font:inherit}button{cursor:pointer}#phone{position:relative;width:min(100vw,390px);height:min(100dvh,780px);min-height:600px;overflow:hidden;border:6px solid #917cab;border-radius:43px;background:linear-gradient(#fff 36%,#fcfaff 62%,#eee7f8);box-shadow:0 15px 40px #8972a333}#phone:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#c6b0df 2px,transparent 2.5px),radial-gradient(#c6b0df 2px,transparent 2.5px);background-size:38px 38px;background-position:3px 4px,22px 23px;mask-image:linear-gradient(#000 0%,#000 65%,transparent 95%);pointer-events:none}.island{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#675779;border-radius:30px;width:90px;height:24px;z-index:4}.status{position:absolute;top:15px;left:23px;right:20px;display:flex;justify-content:space-between;font-size:13px;font-weight:800;z-index:3}.bar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:110px;height:5px;background:#a58bbe;border-radius:8px;z-index:6}section{position:absolute;inset:0}#lock{display:flex;align-items:center;flex-direction:column;padding:90px 15px 26px}.time{font-size:69px;font-weight:900;letter-spacing:-3px;font-variant-numeric:tabular-nums}.date{font-size:15px;font-weight:700}.pin{margin-top:auto;display:flex;align-items:center;flex-direction:column}.dots{display:flex;gap:18px;margin:16px 0 22px}.dots i{width:12px;height:12px;border:2px solid #ae93cd;border-radius:50%}.dots i.on{background:#ae93cd}.keys{display:grid;grid-template-columns:repeat(3,66px);gap:11px 24px}.keys button{border:0;width:66px;height:66px;border-radius:50%;background:#ffffffc7;color:#9e80bd;font-size:30px;font-weight:900}.keys button:active{background:#e8dcf8}.error{height:20px;margin-top:8px;font-size:12px}#home{display:none;padding:86px 12px 38px;flex-direction:column}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 4px}.app{border:0;background:none;color:#967ab4;font-size:11px;font-weight:650;display:flex;flex-direction:column;align-items:center;gap:6px}.ico{width:60px;height:60px;border-radius:17px;background:#ffffffdc;display:grid;place-items:center;box-shadow:0 4px 12px #a18cb522;font-size:29px}.ico svg{width:45px;height:45px;filter:blur(.7px)}.dock{margin-top:auto;display:flex;justify-content:space-around;background:#ffffffaa;border-radius:24px;padding:11px 3px}.dock .app>span:last-child{display:none}#panel{display:none;inset:39px 0 0;background:#fcfaff;z-index:5;flex-direction:column}.head{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #eee6f5}.head button{border:0;background:none;color:#9d80c1;font-size:25px}.body{flex:1;overflow:auto;padding:16px 15px 36px}.person{width:100%;display:flex;align-items:center;gap:12px;padding:13px 8px;border:0;border-bottom:1px solid #eee6f5;background:transparent;text-align:left;color:#9278b2}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#e9ddf4;font-size:23px}.person small{display:block;color:#b7a3cb;margin-top:5px}.conversation{display:flex;flex-direction:column;gap:12px;min-height:340px}.bubble{max-width:82%;align-self:flex-start;background:#eee4f6;padding:11px 14px;border-radius:17px;font-size:13px}.bubble.mine{align-self:flex-end;background:#d7c5eb}.compose{display:flex;gap:7px;margin-top:12px}.compose input{flex:1;min-width:0;border:1px solid #e5d7f1;background:white;border-radius:20px;padding:11px;color:#896ea9}.btn{border:0;border-radius:15px;background:#cbb6e5;color:white;padding:10px 14px}.player{display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:38px}.album{width:190px;height:190px;border-radius:26px;background:linear-gradient(135deg,#faf5ff,#cdb6e8);display:grid;place-items:center;font-size:80px}.controls{display:flex;align-items:center;gap:28px}.controls button{border:0;background:none;color:#a58ac4;font-size:27px}.controls .play{background:#d5c2e9;color:white;border-radius:50%;width:58px;height:58px}.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.month button{border:0;background:none;color:#9b7bbb;font-size:24px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px 2px;text-align:center}.cal button{height:36px;border:0;border-radius:50%;background:transparent;color:#9275ae}.cal button.sel{background:#d4bee9;color:white}.event{background:#f1eaf9;padding:17px;border-radius:17px;margin-top:24px;font-size:13px}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gallery div{aspect-ratio:1;background:#f0e6f9;border-radius:15px;display:grid;place-items:center;font-size:35px}@media(max-width:420px){body{background:white}#phone{height:100dvh;min-height:0;border-radius:0;border:0;width:100vw;box-shadow:none}.keys{gap:8px 24px}.keys button{width:62px;height:62px}.time{font-size:65px}}</style><style>
@keyframes lavenderUnlock{from{opacity:0;transform:scale(1.08);filter:blur(9px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes lavenderOpen{from{opacity:0;transform:scale(.88) translateY(18px);border-radius:38px}to{opacity:1;transform:scale(1) translateY(0);border-radius:0}}
@keyframes lavenderBubble{from{opacity:0;transform:translateY(12px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes lavenderBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#home{transform-origin:center;animation:lavenderUnlock .46s cubic-bezier(.2,.8,.2,1) both}
#panel{transform-origin:center 35%;animation:lavenderOpen .34s cubic-bezier(.16,1,.3,1) both}
.app:active .ico,.keys button:active{transform:scale(.91);transition:transform .12s}
.ico{transition:transform .22s cubic-bezier(.2,1.5,.3,1)}
.app:hover .ico{transform:translateY(-3px) scale(1.04)}
.bubble{animation:lavenderBubble .25s ease-out both}
.player .album{animation:lavenderBounce 3s ease-in-out infinite;animation-play-state:paused}
.player .album.is-playing{animation-play-state:running}
@media(prefers-reduced-motion:reduce){#home,#panel,.bubble,.player .album{animation:none!important}.ico{transition:none!important}}
</style>
<div id="phone"><div class="island"></div><div class="status"><span id="st"></span><span>▂▅▇ ◕ ▰</span></div><section id="lock"><div class="time" id="time"></div><div class="date" id="date"></div><div class="pin"><div>암호 입력</div><div class="dots" id="dots"><i></i><i></i><i></i><i></i></div><div class="keys" id="keys"></div><div class="error" id="err"></div></div></section><section id="home"><div class="apps" id="apps"></div><div class="dock" id="dock"></div></section><section id="panel"><div class="head"><button id="back">‹</button><strong id="title"></strong><button id="goHome">⌂</button></div><div class="body" id="body"></div></section><div class="bar" id="bar"></div></div>
<script>
const $=id=>document.getElementById(id);let pin='',app='',chat='',chats={},month=new Date().getMonth(),year=new Date().getFullYear(),selected=new Date().getDate(),track=0,playing=false;const songs=['Lavender Dream','Little Star','Soft Morning'],people=[['🧸','소오','안녕.'],['🎀','우타','오늘도 좋은 하루!'],['🌷','봄','꽃이 피었어.']];function tick(){let d=new Date(),t=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});$('st').textContent=t;$('time').textContent=t;$('date').textContent=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})}tick();setInterval(tick,1000);function dot(){$('dots').querySelectorAll('i').forEach((e,i)=>e.classList.toggle('on',i<pin.length))}function key(n){if(n==='⌫'){pin=pin.slice(0,-1);dot();return}if(pin.length>=4)return;pin+=n;dot();$('err').textContent='';if(pin.length===4)setTimeout(()=>{if(pin==='0205'){$('lock').style.display='none';$('home').style.display='flex'}else $('err').textContent='암호가 올바르지 않아요';pin='';dot()},200)}['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(n=>{let b=document.createElement('button');b.textContent=n;b.disabled=!n;b.onclick=()=>key(n);$('keys').append(b)});const icons={메시지:'<path d="M9 12H51Q55 12 55 17V39Q55 44 50 44H24L11 53V44H9Q5 44 5 39V17Q5 12 9 12Z" fill="#b6a1cf"/>',음악:'<path d="M35 9Q37 6 40 12L53 24Q60 35 52 45Q47 51 43 44Q42 41 47 36L42 30L35 23L32 47Q29 57 17 54Q6 51 10 41Q13 33 27 36L30 13Q31 10 35 9Z" fill="#b6a1cf"/>',캘린더:'<rect x="9" y="14" width="44" height="39" rx="5" fill="none" stroke="#ad93c9" stroke-width="5"/><path d="M10 26H52M20 8V20M41 8V20" stroke="#ad93c9" stroke-width="5" stroke-linecap="round"/><g fill="#ad93c9"><circle cx="22" cy="35" r="2.8"/><circle cx="32" cy="35" r="2.8"/><circle cx="42" cy="35" r="2.8"/><circle cx="22" cy="44" r="2.8"/><circle cx="32" cy="44" r="2.8"/><circle cx="42" cy="44" r="2.8"/></g>'};const apps=[['🖼️','갤러리'],['','메시지'],['','음악'],['','캘린더'],['🧸','캐릭터'],['📝','메모'],['📷','카메라'],['⚙️','설정']];function icon(a,where){let b=document.createElement('button');b.className='app';b.innerHTML='<span class="ico">'+(icons[a[1]]?'<svg viewBox="0 0 60 60">'+icons[a[1]]+'</svg>':a[0])+'</span><span>'+a[1]+'</span>';b.onclick=()=>openApp(a[1]);$(where).append(b)}apps.forEach(a=>icon(a,'apps'));apps.slice(0,4).forEach(a=>icon(a,'dock'));function show(s){$('body').innerHTML=s}function openApp(n){app=n;$('title').textContent=n;$('panel').style.display='flex';render()}function render(){if(app==='메시지')return messages();if(app==='음악')return music();if(app==='캘린더')return calendar();if(app==='갤러리')return show('<div class="gallery"><div>💜</div><div>🎀</div><div>🌷</div><div>🧸</div></div><p style="text-align:center;font-size:12px">커미션 작품을 추가할 공간 ♡</p>');if(app==='메모'){show('<textarea id="memo" style="width:100%;height:180px;border:1px solid #e4d7ef;border-radius:14px;padding:14px" placeholder="메모를 적어봐 ♡"></textarea>');$('memo').value=localStorage.getItem('lavMemo')||'';$('memo').oninput=()=>localStorage.setItem('lavMemo',$('memo').value);return}if(app==='설정'){show('<button class="btn" id="relock">🔒 화면 잠그기</button>');$('relock').onclick=()=>{$('panel').style.display='none';$('home').style.display='none';$('lock').style.display='flex'};return}show('<p style="text-align:center;padding:70px 0">💜<br>이 앱은 다음에 꾸며보자!</p>')}function messages(){chat='';$('title').textContent='메시지';show('<p style="font-size:12px">Messages ♡</p><div id="people"></div>');people.forEach(p=>{let b=document.createElement('button');b.className='person';b.innerHTML='<span class="avatar">'+p[0]+'</span><span><strong>'+p[1]+'</strong><small>'+p[2]+'</small></span>';b.onclick=()=>conversation(p);$('people').append(b)})}function conversation(p){chat=p[1];$('title').textContent=chat;let list=chats[chat]||[{mine:false,text:p[2]}];show('<div class="conversation" id="conv"></div><div class="compose"><input id="msg" placeholder="메시지 입력..."><button class="btn" id="send">전송</button></div>');function draw(){let c=$('conv');c.replaceChildren();list.forEach(m=>{let d=document.createElement('div');d.className='bubble'+(m.mine?' mine':'');d.textContent=m.text;c.append(d)})}draw();function send(){let v=$('msg').value.trim();if(!v)return;list.push({mine:true,text:v});chats[chat]=list;$('msg').value='';draw()}$('send').onclick=send;$('msg').onkeydown=e=>{if(e.key==='Enter')send()}}function music(){show('<div class="player"><div class="album">♫</div><strong id="song"></strong><small>demo playlist ♡</small><div class="controls"><button id="prev">⏮</button><button id="play" class="play">▶</button><button id="next">⏭</button></div><small>음원 파일 연결 전의 테스트 플레이어야</small></div>');function refresh(){$('song').textContent=songs[track];$('play').textContent=playing?'Ⅱ':'▶';document.querySelector('.album')?.classList.toggle('is-playing',playing)}$('prev').onclick=()=>{track=(track+2)%3;playing=false;refresh()};$('next').onclick=()=>{track=(track+1)%3;playing=false;refresh()};$('play').onclick=()=>{playing=!playing;refresh()};refresh()}function calendar(){let first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();show('<div class="month"><button id="prevM">‹</button><strong>'+year+'년 '+(month+1)+'월</strong><button id="nextM">›</button></div><div class="cal" id="cal"></div><div class="event" id="event"></div>');['일','월','화','수','목','금','토'].forEach(w=>{let d=document.createElement('div');d.textContent=w;$('cal').append(d)});for(let i=0;i<first;i++)$('cal').append(document.createElement('div'));for(let d=1;d<=days;d++){let b=document.createElement('button');b.textContent=d;b.className=d===selected?'sel':'';b.onclick=()=>{selected=d;calendar()};$('cal').append(b)}$('event').textContent=(month+1)+'월 '+selected+'일 · 등록된 일정이 없어요 ♡';$('prevM').onclick=()=>{month--;if(month<0){month=11;year--}selected=1;calendar()};$('nextM').onclick=()=>{month++;if(month>11){month=0;year++}selected=1;calendar()}}$('back').onclick=()=>{if(app==='메시지'&&chat)messages();else $('panel').style.display='none'};$('goHome').onclick=()=>{$('panel').style.display='none'};$('bar').onclick=()=>{if($('lock').style.display==='none')$('panel').style.display='none'};
</script></html>
